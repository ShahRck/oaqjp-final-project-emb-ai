<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 { color: #333; text-align: center; }
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #ddd;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <div class="input-area">
        <textarea id="textToAnalyse" placeholder="Enter text to analyse emotions..."></textarea>
        <button onclick="analyseEmotion()">Analyse Emotion</button>
    </div>
    <div id="output">Results will appear here...</div>

    <script>
        function analyseEmotion() {
            const text = document.getElementById('textToAnalyse').value;
            const outputDiv = document.getElementById('output');

            fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    outputDiv.innerHTML = data;
                })
                .catch(error => {
                    outputDiv.innerHTML = 'Error: ' + error;
                });
        }
    </script>
</body>
</html>
